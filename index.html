    <!--
      Boot styles. The page background is the brand ink colour from the
      first paint, so the screen never flashes white. #root is a tiny
      branded skeleton (logo + spinner) that React replaces on mount —
      it is the loading state every visitor sees, not hidden content.

      The full SEO content is delivered three ways, none of which require
      hiding anything from anyone:
        1. <head> meta tags + JSON-LD (read by Googlebot without rendering)
        2. <noscript> inline content below (for genuine no-JS clients)
        3. Static prerendered routes under /web-development-*-mumbai/ etc.
    -->
    <style>
      html, body { background: #06070A; color: #fff; margin: 0; min-height: 100%; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #06070A; z-index: 0;
      }
      .boot-mark {
        width: 56px; height: 56px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark { animation: none; }
      }
    </style>
