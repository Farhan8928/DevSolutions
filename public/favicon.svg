<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    DuoStack favicon. Two stacked rounded bars representing
    "duo" (two co-founders) and "stack" (engineering stack),
    constructed on a 64-unit grid. Reads cleanly from 16×16
    browser tab to 512×512 PWA install icon.
  -->
  <rect width="64" height="64" rx="14" fill="#C8FF00"/>
  <rect x="18" y="14" width="34" height="12" rx="6" fill="#06070A"/>
  <rect x="12" y="34" width="40" height="12" rx="6" fill="#06070A"/>
</svg>
